name: Spec Divergence
description: Report behavior in Scramjet that diverges from a web specification
labels: ["spec divergence"]
title: "[spec divergence] "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting this bug report, please search existing issues and make sure it's unique.
        If you ignore this text, and create this one, you will be permanently banned from
        interacting with the project.
  - type: input
    id: version
    attributes:
      label: Version
      description: Can be copied from scramjet://about or through the web console with `$scramjet.versionInfo.version`
    validations:
      required: true
  - type: input
    id: Build
    attributes:
      label: Build
      description: Can be copied from scramjet://about or through the web console with `$scramjet.versionInfo.build`
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Have you tested that this is not an upstream issue or an issue with your configuration?
      options:
        - label: I have tried reproducing this issue in the Scramjet Demo and it could be reproduced there
        - label: I have confirmed this behavior does not occur in the same browser without Scramjet
  - type: input
    id: description
    attributes:
      label: Description
      description: A clear and concise description (in one line) of the divergence.
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: Affected API
      description: The web API, interface, or feature that diverges (e.g. `Location.prototype.assign`, `document.cookie`)
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: A link to the relevant section of the specification (WHATWG, W3C, ECMAScript, etc.)
      placeholder: https://html.spec.whatwg.org/multipage/...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to Reproduce?
      description: Steps or a minimal code snippet that demonstrates the divergence
      render: js
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What Scramjet actually does
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What the spec says should happen
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here, such as which browsers you tested in or relevant WPT tests.
