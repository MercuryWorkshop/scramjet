name: Rewriter Divergence
description: Report JavaScript that Scramjet's rewriter mangles, fails to parse, or rewrites incorrectly
labels: ["rewriter divergence"]
title: "[rewriter divergence] "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting this bug report, please search existing issues and make sure it's unique.
        If you ignore this text, and create this one, you will be permanently banned from
        interacting with the project.
  - type: input
    id: version
    attributes:
      label: Version
      description: Can be copied from scramjet://about or through the web console with `$scramjet.versionInfo.version`
    validations:
      required: true
  - type: input
    id: Build
    attributes:
      label: Build
      description: Can be copied from scramjet://about or through the web console with `$scramjet.versionInfo.build`
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Have you tested that this is not an upstream issue or an issue with your configuration?
      options:
        - label: I have tried reproducing this issue in the Scramjet Demo and it could be reproduced there
        - label: I have confirmed the input script runs correctly in the same browser without Scramjet
  - type: input
    id: description
    attributes:
      label: Description
      description: A clear and concise description (in one line) of the rewriter bug.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of failure
      options:
        - Rewritten output is a syntax error
        - Rewritten output behaves differently from the original
        - Something that should be rewritten is not (leak)
        - Rewriter panics / errors
        - Performance (rewriting is slow or uses excessive memory)
        - Other
    validations:
      required: true
  - type: dropdown
    id: script-type
    attributes:
      label: Script type
      description: How the script was loaded
      options:
        - Classic script
        - ES module
        - Inline script / event handler attribute
        - Worker / SharedWorker / ServiceWorker
        - eval / Function constructor
        - Unknown
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: The URL of the script that is rewritten incorrectly, if it's publicly accessible
      placeholder: https://example.com/static/app.js
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: The smallest JavaScript snippet that reproduces the issue. Please reduce it as much as possible rather than pasting a whole bundle.
      render: js
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Rewritten output
      description: What the rewriter produced for the input above (if you can obtain it)
      render: js
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Any console error, rewriter error, or panic message
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What the rewritten code should have done or looked like
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here, such as which browsers you tested in or any site flags you have set.
