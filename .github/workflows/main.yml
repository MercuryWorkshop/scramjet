name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "controller-v*"
      - "utils-v*"
      - "bootstrap-v*"
      - "create-proxy-app-v*"
    paths-ignore: &ci_ignore_paths
      - ".zed/**"
      - ".vscode/**"
      - "README.md"
      # Formatters
      - ".editorconfig"
      - "eslint.config.json"
      - "prettier.config.json"
  pull_request:
    paths-ignore: *ci_ignore_paths
  workflow_dispatch:

env:
  WASM_BINDGEN_VERSION: "0.2.105"
  NODE_VERSION: "24"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-info:
    name: Resolve Release Target
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      tag_arg: ${{ steps.resolve.outputs.tag_arg }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      tgz_prefix: ${{ steps.resolve.outputs.tgz_prefix }}
      release_name: ${{ steps.resolve.outputs.release_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve package from tag
        id: resolve
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Not a tag push; nothing to release"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$GITHUB_REF_NAME" in
            create-proxy-app-v*)
              PKG=create-proxy-app; DIR=packages/create-proxy-app; ARTIFACT=create-proxy-app-package; TGZ_PREFIX=create-proxy-app-; VERSION_PART="${GITHUB_REF_NAME#create-proxy-app-v}" ;;
            controller-v*)
              PKG=controller; DIR=packages/controller; ARTIFACT=scramjet-controller-package; TGZ_PREFIX=mercuryworkshop-scramjet-controller-; VERSION_PART="${GITHUB_REF_NAME#controller-v}" ;;
            utils-v*)
              PKG=utils; DIR=packages/utils; ARTIFACT=scramjet-utils-package; TGZ_PREFIX=mercuryworkshop-scramjet-utils-; VERSION_PART="${GITHUB_REF_NAME#utils-v}" ;;
            bootstrap-v*)
              PKG=bootstrap; DIR=packages/bootstrap; ARTIFACT=proxy-bootstrap-package; TGZ_PREFIX=mercuryworkshop-proxy-bootstrap-; VERSION_PART="${GITHUB_REF_NAME#bootstrap-v}" ;;
            v*)
              PKG=core; DIR=packages/core; ARTIFACT=scramjet-package; TGZ_PREFIX=mercuryworkshop-scramjet-; VERSION_PART="${GITHUB_REF_NAME#v}" ;;
            *)
              echo "Unrecognized tag '$GITHUB_REF_NAME'; expected v<version>, controller-v<version>, utils-v<version>, bootstrap-v<version> or create-proxy-app-v<version>" >&2
              exit 1 ;;
          esac

          VERSION=$(jq -r .version "$DIR/package.json")
          echo "Tag: $GITHUB_REF_NAME, package: $PKG, version: $VERSION"

          if [ "$VERSION_PART" != "$VERSION" ]; then
            echo "Tag version '$VERSION_PART' does not match $DIR/package.json version ($VERSION)" >&2
            exit 1
          fi

          TAG_ARG=""
          if [[ "$VERSION" == *-* ]]; then PRE="${VERSION#*-}"; TAG_ARG="--tag ${PRE%%[.+]*}"; fi

          echo "is_tag=true" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_arg=$TAG_ARG" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "tgz_prefix=$TGZ_PREFIX" >> "$GITHUB_OUTPUT"
          echo "release_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    name: Build Scramjet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Setup Rewriter Toolchain
        uses: ./.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: ${{ env.WASM_BINDGEN_VERSION }}
          rewriter-path: packages/core/rewriter
          github-token: ${{ github.token }}

      - name: Build and pack every package (release rewriter, core, controller, utils, bootstrap, create-proxy-app)
        run: ./cv npm --yes

      - name: Upload Artifact (scramjet/core)
        uses: actions/upload-artifact@v4
        with:
          name: scramjet
          path: packages/core/dist/*

      - name: Upload Artifact (scramjet/core) (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: scramjet-package
          path: packages/core/mercuryworkshop-scramjet-*.tgz

      - name: Upload Artifact (scramjet/controller)
        uses: actions/upload-artifact@v4
        with:
          name: scramjet-controller
          path: packages/controller/dist/*

      - name: Upload Artifact (scramjet/controller) (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: scramjet-controller-package
          path: packages/controller/mercuryworkshop-scramjet-controller-*.tgz

      - name: Upload Artifact (scramjet/utils)
        uses: actions/upload-artifact@v4
        with:
          name: scramjet-utils
          path: packages/utils/dist/*

      - name: Upload Artifact (scramjet/utils) (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: scramjet-utils-package
          path: packages/utils/mercuryworkshop-scramjet-utils-*.tgz

      - name: Upload Artifact (proxy-bootstrap) (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: proxy-bootstrap-package
          path: packages/bootstrap/mercuryworkshop-proxy-bootstrap-*.tgz

      - name: Upload Artifact (create-proxy-app) (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: create-proxy-app-package
          path: packages/create-proxy-app/create-proxy-app-*.tgz

  package-validation:
    name: Validate Package Structure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: scramjet-package
          path: packages/core

      - name: Extract package
        run: tar xvf mercuryworkshop-scramjet-*.tgz package --strip-components=1
        working-directory: packages/core

      - name: Run package validation tests
        run: ./cv validate

  tests:
    name: Run Scramjet Tests
    runs-on: ubuntu-latest
    needs: [build, package-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get artifacts (scramjet/core)
        uses: actions/download-artifact@v4
        with:
          name: scramjet
          path: packages/core/dist

      - name: Get artifacts (scramjet/controller)
        uses: actions/download-artifact@v4
        with:
          name: scramjet-controller
          path: packages/controller/dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/runway

      - name: Run Runway tests
        run: OMIT_WPT=1 CV_PREBUILT=core,controller ./cv test --parallel 4

  rewritertests:
    name: Run Rewriter Tests
    runs-on: ubuntu-latest
    needs: [build, package-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/core/rewriter -> target"
          cache-all-crates: true
          shared-key: "rewriter"

      - name: Run Tests
        run: cargo test
        working-directory: packages/core/rewriter/native

  upload:
    name: Upload release
    runs-on: ubuntu-latest
    needs: [release-info, build, package-validation, tests, rewritertests]
    permissions: write-all
    if: github.ref == 'refs/heads/main' || needs.release-info.outputs.is_tag == 'true'

    steps:
      - name: Delete old release and tag
        if: github.ref == 'refs/heads/main'
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
          github_token: ${{ github.token }}

      - name: Get artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: scramjet-package
          path: .

      - name: Get artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: scramjet-controller-package
          path: .

      - name: Release unstable build to GitHub
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          name: Continuous Build
          tag: latest
          commit: main
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: "mercuryworkshop-scramjet-*.tgz,mercuryworkshop-scramjet-controller-*.tgz,mercuryworkshop-scramjet-utils-*.tgz"
          prerelease: true

      - name: Get artifacts (tagged package)
        if: needs.release-info.outputs.is_tag == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release-info.outputs.artifact_name }}
          path: .

      - name: Release tagged version to GitHub
        if: needs.release-info.outputs.is_tag == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: "${{ needs.release-info.outputs.release_name }}"
          tag: "${{ github.ref_name }}"
          body: "[${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})"
          artifacts: "${{ needs.release-info.outputs.tgz_prefix }}${{ needs.release-info.outputs.version }}.tgz"
          makeLatest: ${{ needs.release-info.outputs.package == 'core' }}
          draft: true

  publish:
    name: Publish Scramjet to NPM
    runs-on: ubuntu-latest
    needs: [release-info, build, package-validation, tests, rewritertests]
    permissions: write-all
    if: needs.release-info.outputs.is_tag == 'true'

    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release-info.outputs.artifact_name }}
          path: .

      - name: Publish to NPM
        run: pnpm stage publish ${{ needs.release-info.outputs.tgz_prefix }}${{ needs.release-info.outputs.version }}.tgz --access public --provenance ${{ needs.release-info.outputs.tag_arg }}

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions: write-all
    needs: [build, package-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get artifacts (scramjet/core)
        uses: actions/download-artifact@v4
        with:
          name: scramjet
          path: packages/core/dist

      - name: Get artifacts (scramjet/controller)
        uses: actions/download-artifact@v4
        with:
          name: scramjet-controller
          path: packages/controller/dist

      - name: Get artifacts (scramjet/utils)
        uses: actions/download-artifact@v4
        with:
          name: scramjet-utils
          path: packages/utils/dist

      - name: Build Frontend
        run: VITE_WISP_URL="wss://anura.pro/" CV_PREBUILT=core,controller,utils ./cv build demo

      - name: Upload Artifact (frontend)
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: ./packages/demo/dist

  pages:
    name: Upload to Github Pages
    runs-on: ubuntu-latest
    needs: [frontend, tests, rewritertests]
    permissions: write-all
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: .

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to github
        id: deployment
        uses: actions/deploy-pages@v4
